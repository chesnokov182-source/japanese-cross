<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Кроссворд по японскому языку (JLPT)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a6fa5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JLPT Crosswords">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
<div class="crossword-container">
    <div class="grid-section">
        <div class="level-selector">
    <span>Уровень JLPT:</span>
    <select id="levelSelect">...</select>
    <span>Кроссворд:</span>
    <select id="puzzleSelect"></select>
    <button id="buyPuzzleBtn" style="display: none;">💰 Купить</button>
    <button id="resetBtn">Сбросить кроссворд</button>
    <button id="hintBtn">Подсказка (1 раз)</button>
    <button id="themeToggle">🌓 Тема</button>
    <button id="resetProgressBtn">🗑️ Сбросить весь прогресс</button>
    <button id="helpBtn">❓ Помощь</button>
</div>
            <span>Кроссворд:</span>
            <select id="puzzleSelect"></select>
            <button id="resetBtn">Сбросить кроссворд</button>
            <button id="hintBtn">Подсказка (1 раз)</button>
            <button id="themeToggle">🌓 Тема</button>
            <button id="resetProgressBtn">🗑️ Сбросить весь прогресс</button>
            <button id="helpBtn">❓ Помощь</button>
        </div>
        <div id="gridContainer" class="crossword-grid"></div>
        <div class="status" id="statusMsg"></div>
    </div>
    <div class="clues-section">
        <div class="score-container">
            <div>🎯 Очки: <span id="scoreValue">0</span></div>
            <div>🏆 Слов решено: <span id="wordsCompleted">0</span></div>
        </div>
        <div class="level-progress">
            <div>Прогресс уровня: <span id="levelProgressText">0/0</span></div>
            <div class="progress-bar"><div id="levelProgressFill" class="progress-fill"></div></div>
        </div>
        <div id="cluesContainer"></div>
    </div>
</div>
<div id="toast" class="toast"></div>

<!-- Кастомное модальное окно подтверждения -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <p id="confirmMessage" class="modal-message"></p>
        <div class="modal-buttons">
            <button id="confirmYes" class="modal-btn modal-yes">Да</button>
            <button id="confirmNo" class="modal-btn modal-no">Отмена</button>
        </div>
    </div>
</div>

<!-- Модальное окно туториала -->
<div id="tutorialModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <p class="modal-message" id="tutorialMessage"></p>
        <div class="modal-buttons">
            <button id="tutorialNext" class="modal-btn modal-yes">Далее</button>
            <button id="tutorialClose" class="modal-btn modal-no">Закрыть</button>
        </div>
    </div>
</div>

<script src="crosswords.js"></script>
<script src="script.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW registered', reg))
            .catch(err => console.log('SW registration failed', err));
    }
</script>
</body>
</html>
